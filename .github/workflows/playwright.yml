name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Filter tests by tag (e.g. @mandatory, @advanced) or title'
        required: false
        default: ''
      workers:
        description: 'Number of parallel workers (overrides playwright.config.ts CI default of 2)'
        required: false
        default: ''
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci
      working-directory: PlaywrightFW

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: PlaywrightFW

    - name: Run Playwright tests
      run: npx playwright test ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }} ${{ inputs.workers && format('--workers={0}', inputs.workers) || '' }}
      working-directory: PlaywrightFW

    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npx allure generate ./reports/allure-results -o ./reports/allure-report
      working-directory: PlaywrightFW
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: PlaywrightFW/reports/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: PlaywrightFW/reports/allure-report/
        retention-days: 30
